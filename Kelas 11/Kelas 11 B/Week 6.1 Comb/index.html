<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combination Tag</title>

    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h2>Daftar Website Belajar Pemrograman</h2>
    <p>Untuk mencari referensi lain, kamu bisa mencarinya di 
       <a href="https://www.google.com" target="_blank">Google</a>.
    </p>

    <table>
        <tr>
            <th>No</th>
            <th>Nama Website</th>
            <th>Tautan (Link)</th>
        </tr>
        <tr>
            <td>1</td>
            <td>W3Schools</td>
         
            <td><a href="https://www.w3schools.com" target="_blank">w3schools.com</a></td>
        </tr>
        <tr>
            <td>2</td>
            <td>MDN Web Docs</td>
            <td><a href="https://developer.mozilla.org" target="_blank">developer.mozilla.org</a></td>
        </tr>
        <tr>
            <td>3</td>
            <td>FreeCodeCamp</td>
            <td><a href="https://www.freecodecamp.org" target="_blank">freecodecamp.org</a></td>
        </tr>
    </table>

</html>
