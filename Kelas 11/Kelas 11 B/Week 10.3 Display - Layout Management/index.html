<!DOCTYPE html>
<html lang="en">
<head>
    <title>Simple Calc</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="input-layout">
        <input type="number" id="number1" placeholder="Masukkan Angka Pertama">
        <input type="number" id="number2" placeholder="Masukkan Angka Kedua">
    </div>
    <div class="button-layout">
        <input type="button" id="tambah" value="+" onclick="hitungTambah()">
        <input type="button" id="kurang" value="-" onclick="hitungKurang()">
        <input type="button" id="kali" value="*" onclick="hitungKali()">
        <input type="button" id="bagi" value="/" onclick="hitungBagi()">
    </div>
    <div class="result-layout">
        <input type="text" id="result" placeholder="Hasil" disabled>
    </div>
    <script src="script.js"></script>
</body>
</html>
